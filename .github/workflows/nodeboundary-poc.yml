name: Node-Boundary PoC

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Minikube
        id: minikube
        uses: medyagh/setup-minikube@latest
        with:
          cache: true
          cpus: 'max'
          memory: 'max'

      - name: Kubernetes info
        run: |
          kubectl cluster-info
          kubectl get pods -n kube-system -o wide

      - name: Install demo bookinfo
        run: |
          minikube image load --remote ghcr.io/kubenetworks/examples-bookinfo-details-v1:1.20.2
          minikube image load --remote ghcr.io/kubenetworks/examples-bookinfo-ratings-v1:1.20.2
          minikube image load --remote ghcr.io/kubenetworks/examples-bookinfo-reviews-v1:1.20.2
          minikube image load --remote ghcr.io/kubenetworks/examples-bookinfo-productpage-v1:1.20.2
          minikube image load --remote ghcr.io/kubenetworks/authors:latest
          minikube image load --remote ghcr.io/kubenetworks/nginx:latest
          minikube image ls
          eval $(minikube docker-env)
          kubectl apply -f samples/bookinfo.yaml

      - name: Wait for bookinfo pods to be ready
        run: |
          # Wait up to 5 minutes for reviews, authors, details pods
          for ((i=0; i<60; i++)); do
            reviews_ready=$(kubectl -n default get pod -l app=reviews -o jsonpath='{.items[?(@.status.phase=="Running")].metadata.name}' | wc -w)
            details_ready=$(kubectl -n default get pod -l app=details -o jsonpath='{.items[?(@.status.phase=="Running")].metadata.name}' | wc -w)
            authors_ready=$(kubectl -n default get pod -l app=authors -o jsonpath='{.items[?(@.status.phase=="Running")].metadata.name}' | wc -w)
            if [[ $reviews_ready -gt 0 && $details_ready -gt 0 && $authors_ready -gt 0 ]]; then
              echo "Bookinfo pods are ready"
              kubectl get pods -n default -o wide
              exit 0
            fi
            echo "Waiting for bookinfo pods to be ready... (reviews: $reviews_ready, details: $details_ready, authors: $authors_ready) ($i/60)"
            sleep 5
          done
          echo "Timed out waiting for bookinfo pods"
          kubectl get pods -n default -o wide
          exit 1

      - name: Build test image locally
        run: |
          make kubevpn-linux-amd64
          docker build -f build/Dockerfile -t nodeboundary-poc:latest --build-arg TARGETARCH=amd64 .
          minikube image load nodeboundary-poc:latest
          minikube image ls

      - name: Run Node-Boundary PoC
        id: poc
        env:
          IMAGE: nodeboundary-poc:latest
        run: |
          hack/nodeboundary-poc.sh 2>&1 | tee /tmp/node-boundary-poc.log

      - name: Always upload PoC log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-boundary-poc-log
          path: /tmp/node-boundary-poc.log

      - name: On failure, dump diagnostics
        if: failure()
        run: |
          echo "=== Nodeagent pod logs ==="
          kubectl -n kubevpn-nodeagent-poc logs nodeagent-poc --tail=200 || true
          echo
          echo "=== Host PREROUTING rules ==="
          kubectl -n kubevpn-nodeagent-poc exec nodeagent-poc -- nsenter --net=/host/proc/1/ns/net iptables -t nat -S PREROUTING || true
          echo
          echo "=== Envoy logs ==="
          kubectl -n kubevpn-nodeagent-poc exec nodeagent-poc -- cat /tmp/poc-reviews.log || true
          kubectl -n kubevpn-nodeagent-poc exec nodeagent-poc -- cat /tmp/poc-details.log || true
          kubectl -n kubevpn-nodeagent-poc exec nodeagent-poc -- cat /tmp/poc-udp.log || true
